name: Build and push Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (latest is always published too)'
        required: true
        default: release-20261031
  push:
    # The git tag name becomes the image tag, so the two always match.
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the tag
        run: |
          TAG='${{ github.event.inputs.tag || github.ref_name }}'
          if ! printf '%s' "$TAG" | grep -Eq '^[a-z0-9][a-z0-9._-]{0,127}$'; then
            echo "Invalid Docker tag: '$TAG' (use lowercase letters, digits, dot, dash or underscore)"
            exit 1
          fi
          echo "Publishing syedhamza6265/asset-management-app:$TAG"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            syedhamza6265/asset-management-app:${{ github.event.inputs.tag || github.ref_name }}
            syedhamza6265/asset-management-app:latest
          build-args: |
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
