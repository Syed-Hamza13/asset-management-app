services:
  asset-management:
    image: syedhamza6265/asset-management-app:bookworm-slim
    container_name: asset-management-app
    restart: unless-stopped

    # The Settings "Network restriction (IP allowlist)" feature can only work if the
    # container learns the visitor's own address. Behind nginx that means setting
    # IP_ACCESS_TRUSTED_PROXIES (below) to the address the container sees as its
    # peer - usually BOTH the nginx machine's IP and the Docker bridge gateway
    # 172.17.0.1, which is what Docker's default userland proxy reports. Check the
    # "IP the server sees for you" line on the Settings card from a second device to
    # see which address arrives. Left empty, every visitor looks like the proxy and
    # a single allowlist entry admits everyone.
    ports:
      - "8073:8073"

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8073
      FRONTEND_URL: http://localhost:8073 # or ip address of the host machine

      DB_HOST: your_mysql_host
      DB_PORT: 3306
      DB_NAME: your_db_name
      DB_USER: your_db_user
      DB_PASSWORD: your_db_password

      SESSION_SECRET: replace_with_a_long_random_secret
      TURNSTILE_SITE_KEY: your_turnstile_site_key
      TURNSTILE_SECRET_KEY: your_turnstile_secret_key
      SESSION_MAX_AGE_MS: 86400000

      # Email notifications.
      # SMTP_ENCRYPTION_KEY protects the SMTP password at rest (AES-256-GCM).
      # It must be at least 32 characters and MUST stay stable across restarts and
      # redeploys - changing it makes the stored SMTP password undecryptable.
      # Generate one with:
      #   node -e "console.log(require('crypto').randomBytes(36).toString('base64'))"
      SMTP_ENCRYPTION_KEY: replace_with_a_long_random_secret_at_least_32_chars
      # In-process delivery worker. A MySQL GET_LOCK ensures only one container sends
      # at a time, so this is safe even if the service is scaled horizontally.
      # Set to "false" to stop delivering emails (rows still queue as history).
      EMAIL_WORKER_ENABLED: "true"
      EMAIL_WORKER_INTERVAL_MS: 15000
      EMAIL_MAX_ATTEMPTS: 5

      # Break-glass for the Settings "Network restriction (IP allowlist)" feature.
      # While "true" (default) the saved allowlist gates sign-in and Quick Entry.
      # Set to "false" and recreate the container if an allowlist mistake ever
      # locks every admin out; fix the list in Settings, then set it back.
      IP_ACCESS_ENFORCE: "true"

      # Reverse proxy addresses the IP allowlist may trust for the real client IP.
      # Comma-separated, single addresses or CIDR blocks. Leave empty only when
      # nothing proxies to this container (then the socket address is used).
      # Example for nginx on another machine reaching a published Docker port:
      #   IP_ACCESS_TRUSTED_PROXIES: "192.168.1.10,172.17.0.1"
      IP_ACCESS_TRUSTED_PROXIES: ""

